# V-DASH evaluation grid (brief §3 M4). Each cell = policy × clearance × level, run seed-fixed for
# `num_episodes` trials via policy_runner; the per-episode §3.5 JSONL written by the vdash handoff
# logger is the source of truth. run_eval_grid.py orchestrates one subprocess per cell (each needs a
# fresh Isaac Sim process), is resumable (a cell whose JSONL already has >= num_episodes records is
# skipped), and aggregates to CSV with success rate ± 95% Wilson CI.
policies: [vdash_scripted]
clearances_mm: [2.0, 1.0, 0.5, 0.25]
levels: [L0, L1, L2, L3]
num_episodes: 50
num_envs: 8
seed: 0
env: vdash_pick_insert
log_dir: logs/vdash
out_csv: results/vdash/eval_grid.csv
