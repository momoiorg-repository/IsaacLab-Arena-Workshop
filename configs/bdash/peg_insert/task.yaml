# B-DASH pick-insert task — thresholds & geometry (brief §3.4/§3.5). Units: meters, Newtons.
# Consumed by bdash_pick_insert_task / bdash_peg_predicates / bdash_handoff_logger.
# Thresholds are initial; force_max and grasp_force are calibrated against physics in M2.

scene_names:
  peg: peg
  socket: socket
  robot: robot
  peg_finger_sensor: peg_finger_contact   # ContactSensor on peg, filtered vs the two fingers
  peg_sensor: peg_contact                 # ContactSensor on peg, net force

geometry:
  mouth_height: 0.030          # socket mouth above socket root (socket base sits on the table)
  tip_offset: [0.0, 0.0, 0.0]  # peg tip in peg local frame (peg root ≈ tip; see M1)

grasped:
  width_min: 0.005
  width_max: 0.025
  grasp_force: 1.0             # N — peg↔finger filtered contact (calibrate M2)

handoff:
  r_h: 0.015                   # handoff cylinder radius (m)
  h_low: 0.020                 # cylinder bottom above mouth (m)
  h_high: 0.060                # cylinder top above mouth (m)
  speed_max: 0.05              # m/s

inserted:                      # success predicate
  min_depth: 0.015             # m (mouth_z - tip_z)
  # lateral tolerance = the active socket's clearance c (injected per-socket at build time)

force:
  force_max: 50.0              # N — force_violation / insertion_failed threshold (calibrate M2)

insertion:
  timeout_s: 8.0               # insertion-phase timeout (insertion_failed)

termination:
  episode_length_s: 20.0
