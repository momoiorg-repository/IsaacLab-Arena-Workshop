# B-DASH pick->handoff closed-loop policy config for the GR00T **N1.7** VLA fine-tuned on the **v4**
# dataset (datasets/bdash/vla_pick_handoff_v4). Identical to the v3 config except model_path -> the
# v4 N1.7 checkpoint (Gr00tN1d7 / Cosmos-Reason2-2B backbone), so the v4 eval can be run/aggregated
# separately (run tag grid_bdash_vla_v4). action_horizon stays 16 (<= the model's native 40) to keep
# the executed chunk length comparable across the v3/v4 eval grid. Requires the gn17 container
# (isaaclab_arena-cuda_gr00t_gn17) with submodules/Isaac-GR00T on the N1.7 release.
#
#   policy_runner.py --policy_type isaaclab_arena.policy.bdash_vla_policy.BDashVLAPolicy \
#     --policy_config_yaml_path isaaclab_arena_gr00t/policy/config/bdash_pick_insert_gr00t_closedloop_v4_config.yaml \
#     bdash_pick_insert --embodiment franka_joint --enable_cameras ...
model_path: /workspaces/isaaclab_arena/models/bdash-gr00t-n1-7-pick-handoff-v4
language_instruction: "PER_EPISODE (set by eval_chuck_vla.py)"
action_horizon: 16
embodiment_tag: NEW_EMBODIMENT
video_backend: decord
modality_config_path: isaaclab_arena_gr00t/embodiments/franka/franka_modality_config.py

# Joint orderings — Franka (bdash IS a panda), same as the dataset converter used.
policy_joints_config_path: isaaclab_arena_gr00t/embodiments/franka/gr00t_8dof_action_space.yaml
state_policy_joints_config_path: isaaclab_arena_gr00t/embodiments/franka/gr00t_9dof_joint_space.yaml
action_joints_config_path: isaaclab_arena_gr00t/embodiments/franka/8dof_action_space.yaml
state_joints_config_path: isaaclab_arena_gr00t/embodiments/franka/9dof_joint_space.yaml

action_chunk_length: 16
# Joint-space tabletop manipulation (action = remapped joint targets); reused for bdash.
task_mode_name: franka_tabletop_manipulation

# Three RGB streams in modality order (ego/left/right == wrist/left/right).
pov_cam_name_sim: ["wrist_cam_rgb", "left_cam_rgb", "right_cam_rgb"]

original_image_size: [256, 256, 3]
target_image_size: [256, 256, 3]
