# V-DASH pick->handoff closed-loop policy config for the GR00T **N1.7** VLA — the **v6-recovery** run:
# fine-tuned (FROZEN ViT) on umegan/vdash-pick-handoff-v5-recovery, the 1000-demo recovery set
# RE-RECORDED with the camera render fix so the demos have MOVING frames (all prior vdash datasets
# trained on a single frozen reset frame — the true root cause of the universal 0%). This is the FIRST
# eval where BOTH the recording AND the eval path (policy_runner camera fix) feed live frames, so it's
# the real test of whether moving-frame training lifts the peg-localization failure. Hierarchy eval
# (vdash_vla: VLA pick->handoff, then rule InsertionController). Only model_path differs from v5_vision;
# eval runs/aggregates separately (run tag grid_vdash_vla_v6_recovery). Requires the gn17 container.
model_path: /workspaces/isaaclab_arena/models/vdash-gr00t-n1-7-pick-handoff-v6-recovery
language_instruction: "Pick up the peg and move it over the socket."
action_horizon: 16
embodiment_tag: NEW_EMBODIMENT
video_backend: decord
modality_config_path: isaaclab_arena_gr00t/embodiments/franka/franka_modality_config.py

# Joint orderings — Franka (vdash IS a panda), same as the dataset converter used.
policy_joints_config_path: isaaclab_arena_gr00t/embodiments/franka/gr00t_8dof_action_space.yaml
state_policy_joints_config_path: isaaclab_arena_gr00t/embodiments/franka/gr00t_9dof_joint_space.yaml
action_joints_config_path: isaaclab_arena_gr00t/embodiments/franka/8dof_action_space.yaml
state_joints_config_path: isaaclab_arena_gr00t/embodiments/franka/9dof_joint_space.yaml

action_chunk_length: 16
# Joint-space tabletop manipulation (action = remapped joint targets); reused for vdash.
task_mode_name: franka_tabletop_manipulation

# Three RGB streams in modality order (ego/left/right == wrist/left/right).
pov_cam_name_sim: ["wrist_cam_rgb", "left_cam_rgb", "right_cam_rgb"]

original_image_size: [256, 256, 3]
target_image_size: [256, 256, 3]
